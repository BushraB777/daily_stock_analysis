name: Hub - Kronos forecast

# Kronos (github.com/shiyu-coder/Kronos) daily-bar forecast for the watchlist.
# No API key needed; runs on CPU. Weekdays at 22:45 UTC (02:45 Dubai), after
# the US close, plus manual runs.
on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers (STOCK_LIST format). Empty = the STOCK_LIST variable'
        required: false
        default: ''
      pred_days:
        description: 'Trading days to forecast'
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: hub-kronos
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check out Kronos (pinned)
        uses: actions/checkout@v5
        with:
          repository: shiyu-coder/Kronos
          ref: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          path: kronos_src

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm pandas yfinance

      - name: Forecast
        env:
          TICKERS: ${{ github.event.inputs.tickers || vars.STOCK_LIST }}
          PRED_DAYS: ${{ github.event.inputs.pred_days || '5' }}
          KRONOS_DIR: kronos_src
          OUT_DIR: kronos_out
        run: python hub/kronos_forecast.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kronos-${{ github.run_number }}
          path: kronos_out/
          retention-days: 30
